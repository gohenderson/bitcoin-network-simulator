# yaml-language-server: $schema=./scenario.schema.json
NodeRules:
  # Real Bitcoin's own numbers — see README.md's "Scenarios" section.
  - Name: real-bitcoin
    RetargetIntervalBlocks: 2016
    TargetSecondsPerBlock: 600
    MinAdjustmentFactor: 0.25
    MaxAdjustmentFactor: 4
    InitialDifficultyShift: 8
    InitialBlockReward: 50
    HalvingIntervalBlocks: 210000
    MaxSupply: 21000000

Phases:
  - Description: >-
      One dominant solo miner (HashPower 1000) against nine regular ones (HashPower 1 each),
      fixed at 10 nodes. Demonstrates SIMULATED HASH POWER: the dominant node wins
      proportionally more often, not deterministically every time.
    DurationSeconds: 180
    AutoGrowth: false
    NodeGroups:
    - Count: 1
      Role: Honest
      HashPower: 1000
      CanMine: true
      RulesName: real-bitcoin
    - Count: 9
      Role: Honest
      HashPower: 1
      CanMine: true
      RulesName: real-bitcoin
