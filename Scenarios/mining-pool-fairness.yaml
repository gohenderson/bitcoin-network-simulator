# yaml-language-server: $schema=./scenario.schema.json
- Description: >-
    15 nodes, fixed: 10 plain solo miners plus a 5-member pool ('cooperative') at HashPower
    50 each. Demonstrates MINING POOLS: the pool mines as one combined 250-strong entity
    instead of five separate weaker shots, and splits its reward proportionally among
    members.
  DurationSeconds: 900
  AutoGrowth: false
  NodeGroups:
  - Count: 10
    Role: Honest
    HashPower: 1
    CanMine: true
  - Count: 5
    Role: Honest
    HashPower: 50
    CanMine: true
    Pool: cooperative

  # Consensus economics/proof-of-work — real Bitcoin's own numbers,
  # explicit here for clarity (phase-0-only; see README.md's "Scenarios"
  # section for why these do not vary phase to phase).
  RetargetIntervalBlocks: 2016
  TargetSecondsPerBlock: 600
  MinAdjustmentFactor: 0.25
  MaxAdjustmentFactor: 4
  InitialDifficultyShift: 8
  InitialBlockReward: 50
  HalvingIntervalBlocks: 210000
  MaxSupply: 21000000
