# yaml-language-server: $schema=./scenario.schema.json
NodeRules:
  # Real Bitcoin's own numbers — see README.md's "Scenarios" section.
  - Name: real-bitcoin
    RetargetIntervalBlocks: 2016
    TargetSecondsPerBlock: 600
    MinAdjustmentFactor: 0.25
    MaxAdjustmentFactor: 4
    InitialDifficultyShift: 8
    InitialBlockReward: 50
    HalvingIntervalBlocks: 210000
    MaxSupply: 21000000

DefaultRuleSchedule:
  # Every organically-grown node also follows real-bitcoin, same as the seed
  # NodeGroup below — keeps the whole network in consensus as it grows.
  # (Coincidentally identical to the hardcoded ConsensusRules defaults this
  # scenario would fall back to anyway — see README.md's "Scenarios" section
  # for how Percent/FromHeight let a growth demo split organically-grown
  # nodes across multiple rulesets instead.)
  - { FromHeight: 0, RulesName: real-bitcoin, Percent: 100 }

Phases:
  - Description: >-
      Starts at a single node and lets organic growth run unrestricted (roughly doubling every
      GrowthIntervalSeconds) for the full duration, capped at MaxNodes. Demonstrates
      NodeGrowthLoopAsync's exponential curve at scale, with a fixed, reviewable result folder
      instead of running forever.
    DurationSeconds: 900
    AutoGrowth: true
    GrowthIntervalSeconds: 8
    MaxNodes: 100
    NodeGroups:
    - Count: 1
      Role: Honest
      HashPower: 1
      CanMine: true
      RulesName: real-bitcoin
